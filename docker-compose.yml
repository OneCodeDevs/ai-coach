services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/coach.db
      CONTENT_DIR: /app/content
    volumes:
      - ./data:/app/data
      - ./content:/app/content
    ports:
      - "3000:3000"
    restart: unless-stopped
